<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Datagoblin — evidence-first data intelligence</title>
    <meta
      name="description"
      content="Describe the data you need. Datagoblin plans the sources, collects permitted pages, extracts records, and proves every claim against stored evidence."
    />
    <meta name="theme-color" content="#f6f3ee" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch.png" />
    <meta property="og:title" content="Datagoblin — evidence-first data intelligence" />
    <meta
      property="og:description"
      content="Describe the data you need. Datagoblin plans the sources, collects permitted pages, extracts records, and proves every claim against stored evidence."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Painted before the bundle evaluates, so the first frame is the paper
         colour rather than a white flash. The shader layers in on top. */
      html { background: #f6f3ee; }
      #root { min-height: 100%; }
      /* The shell is JS-rendered; until it mounts, show nothing rather than a
         half-styled frame. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 260ms ease;
      }
      #boot[hidden] { display: none; }
      /* The mark, rounded to match how it sits in the nav rail, so the first
         frame and the mounted app agree on the brand's shape. */
      #boot img {
        width: 88px;
        height: 88px;
        border-radius: 14px;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <!--
      DATAGOBLIN landing surface (/welcome) — direction contract.
      First child of <body> on purpose: it survives the production build, so
      `grep 32f41c97 dist/` audits what this page was actually made to be.

      THESIS: the record is the hero. The page shows its evidence table before
      its argument, because the visitor has already been burned defending a
      number a model produced, and an assertion they can audit persuades where
      one they must trust does not. It refuses the headline-and-three-feature-
      cards template and the hero-metric template: the first viewport is a real
      dataset from a real run with a live proof rail.
      OWN-WORLD: inherited from the operator console, not reinvented. Warm paper
      and ink, one bronze accent, judge purple reserved for judge decisions.
      Instrument Serif for anything a human wrote, DM Mono for anything
      machine-derived. Hairline-ruled citation dossiers over the console's own
      ambient WebGL field, and the signature proof highlight: a value sitting
      inside the sentence that supports it.
      STORY: any cell opens onto the exact stored text; then a quote that
      resolves perfectly turns out to be the wrong column; then the vocabulary
      that will not let "nobody ruled on this" pass as verified. Belief:
      provenance is a system, not a promise. Action: run it and check the rail.
      FIRST VIEWPORT: left, the claim in serif over a lede and two actions;
      right and dominant, the dossier — a recorded prompt, seven rows of a real
      run, and a proof rail opening under any value.
      FORM: candidate 7 of the grounded list, the "record is the hero" dossier.
      Seed key 32f41c97.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <img src="/mark-88.png" alt="" width="88" height="88" />
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
