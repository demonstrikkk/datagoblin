  /api/datasets/{did}/gaps/fill:
    post:
      summary: Fill Dataset Gap
      description: |-
        Attempt one phase on one gap. `apply: false` is the default.

        The ladder is enforced in `gapfill`, not here: a request for phase 2 on a gap
        that has never been through phase 1 is refused with the reason, and nothing is
        searched. `apply: false` still searches, fetches and extracts for real and
        withholds only the write, so the cost on the response is measured rather than
        estimated.

        Phase 2 is the first thing in the system that spends money on the open web
        without a full run behind it, so the request body may not raise the search
        budget: `search_budget` is clamped to `MAX_SEARCHES_PER_PASS` and a larger
        value is an error rather than a silent clamp, because a silently ignored
        budget is indistinguishable from one that was honoured.
      operationId: fill_dataset_gap_api_datasets__did__gaps_fill_post
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          title: Did
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Fill Dataset Gap Api Datasets  Did  Gaps Fill Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/datasets/{did}/rejudge:
    post:
      summary: Rejudge Dataset
      description: |-
        Judge the cells that carry a value and a quote but no verdict. Writes nothing
        unless `apply`.

        These are cells the extractor got right and the judge never checked, usually
        because the per-run budget ran out mid-dataset. Their pages are still stored,
        so this costs judge calls and nothing else — no crawl, no fetch, no
        extraction.

        Measured over the live database's 992 such cells: 733 are settled by
        `jev.deterministic_verdict` before any provider call, and 259 genuinely need
        a judgement. So the real cost of closing the gap is 259 calls, not 992.

        **No value is ever changed or removed.** A judgement upgrades a cell's status
        to `verified`, or demotes it to `unverified` and records the disagreement, or
        leaves it exactly as it was. `verify_field` nulls a NOT_SUPPORTED value,
