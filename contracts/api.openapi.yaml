        carried is reported as absent, never defaulted — a coverage number that
        filled its own gaps would be worse than no number at all.

        `gaps` adds the attempt history from 007: the same fields, classified by which
        remedy could close them, and annotated with how far each has actually been
        tried. `backlog` stays because it is the un-annotated derived list the existing
        view already renders; `gaps` is the version that can tell "never attempted"
        from "tried and the sources do not answer it". `tracked` says whether this
        adapter can persist that history at all, so a read that silently degrades to
        derived-only does not look identical to one that remembers.
      operationId: dataset_coverage_api_datasets__did__coverage_get
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          title: Did
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Dataset Coverage Api Datasets  Did  Coverage Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sources:
    get:
      summary: List Sources
      description: |-
        Every host this workspace has stored evidence from, across all runs.

        The source browser answers "what has ever been fetched, and how much of it
        paid". There was no read for it: `get_pages` is scoped to one run and
        `get_sources` to one dataset, so the only way to assemble the view was one
        request per run from the browser.

        Returns an empty list rather than an error on a repository that has not
        implemented the aggregate, so the view degrades to "no trail yet" instead of
        a 500 that looks like a broken backend.
      operationId: list_sources_api_sources_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Sources Api Sources Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/pages:
    get:
      summary: Run Pages
      description: |-
        Stored evidence for one run, newest first.

        Thin wrapper: both repositories have carried `get_pages` since the beginning
        and nothing ever called it. That is why the UI could show a quote's
        `@start-end` offsets with no way to open the page those offsets address —
        the proof had no retrieval path, so it was decoration.
      operationId: run_pages_api_runs__run_id__pages_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: x-api-key
        in: header
        required: false
