  /api/datasets/{did}:
    get:
      summary: Get Dataset
      description: |-
        The dataset's own columns, and its records only when asked for.

        `records` used to be attached unconditionally, which meant this endpoint
        shipped the entire dataset — measured at 402 kB and 3.3 s for 56 records —
        while the page separately asked `/records` for the same rows and got
        another 400 kB. Every dataset page load transferred its data twice over a
        remote database, and the payload grew with the dataset.

        `get_dataset` in the repository still attaches records, because callers
        inside the pipeline want the whole thing; this route simply stops shipping
        them by default. `?include_records=true` brings the old shape back.
      operationId: get_dataset_api_datasets__did__get
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          title: Did
      - name: include_records
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Records
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      - name: X-Request-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Request-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Dataset Api Datasets  Did  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Dataset
      description: |-
        Delete one dataset, its records, its gap history and its export ledger.

        There is no undo and no bulk form, so the guard is explicit: the body must
        carry `{"confirm": "<the full dataset id>"}`, exactly matching the id in
        the path. Anything else — missing, truncated, wrong — is a 422 and nothing
        is touched. The UI asks twice before it ever sends that body.

        Sources, pages and runs belong to the *run*, not the dataset, and survive:
        the run stays as the audit trail of work that happened, and its stored
        pages stay reusable by future runs.
      operationId: delete_dataset_api_datasets__did__delete
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          title: Did
      - name: x-api-key
        in: header
        required: false
        schema:
