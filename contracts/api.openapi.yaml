              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RunBody:
      type: object
      properties:
        plan_id:
          type: string
        dataset_name:
          type: string
        credit_budget:
          type: integer
          description: 0 or absent means unlimited
        reuse_stored_pages:
          type: boolean
      required:
      - plan_id
    ExportBody:
      type: object
      properties:
        format:
          type: string
          enum:
          - csv
          - json
          - jsonl
          - md
          default: json
        fields:
          type: array
          items:
            type: string
          description: column subset; absent means all
    RefreshBody:
      type: object
      properties:
        apply:
          type: boolean
        limit:
          type: integer
          default: 10
        sources:
          type: array
          items:
            type: string
          description: host or URL substrings; absent means all
    RejudgeBody:
      type: object
      properties:
        apply:
          type: boolean
        field:
          type: string
        phase:
          type: integer
        judge_budget:
          type: integer
          minimum: 0
          description: cap on paid judge calls. 0 means ZERO, not unlimited — pass a positive
            number to allow any at all
    GapFillBody:
      type: object
      properties:
        apply:
          type: boolean
        field:
          type: string
        phase:
          type: integer
          enum:
          - 1
          - 2
    DatasetQueryBody:
      type: object
      properties:
        question:
          type: string
        sql:
          type: string
        limit:
          type: integer
    SelectorSaveBody:
      type: object
      properties:
        domain:
          type: string
        page_url:
          type: string
        provider:
          type: string
        fields:
          type: array
          items:
            type: object
        overwrite:
          type: boolean
    SelectorProposeBody:
      type: object
      properties:
        url:
          type: string
        page_id:
          type: string
        fields:
          type: array
          items:
            type: object
      required:
      - url
      - fields
    AddColumnBody:
      type: object
      properties:
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
        type:
          type: string
        description:
          type: string
      required:
      - name
