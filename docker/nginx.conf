# DATAGOBLIN - static SPA + reverse proxy to the API.
#
# One origin. The bundle calls "/api" relative to itself, so every request the
# browser makes lands on this server and is forwarded to the api container.
# No CORS, no VITE_API_URL, no second port for the friend to remember.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression (text only; the bundle is already the bulk of the bytes) ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Vite fingerprints everything under /assets/, so those files are safe to
    # cache forever. index.html must NOT be cached, or a rebuild never reaches
    # the browser: it keeps loading the previous bundle against new assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- the API ---
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE. /api/runs/{id}/stream is a long-lived response that must reach
        # the browser as it is produced: with buffering on, nginx holds every
        # event until the run ends and the live timeline looks frozen. The
        # long timeouts cover the default 1200s run budget.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Exports and dataset listings can be large; let them out, but do not
        # hang forever on a stalled upstream.
        client_max_body_size 32m;
        proxy_connect_timeout 10s;
    }

    # --- SPA fallback: unknown paths are client-side routes, not 404s ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}